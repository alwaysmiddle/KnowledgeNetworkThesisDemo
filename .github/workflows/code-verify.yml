name: code-verify

# Verifies the app code, and nothing outside this repository.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # The unit tests. Until 2026-09-03 this workflow built and linted and never
      # ran them, so the whole suite only ran when someone typed the command on
      # their own machine. The browser tests in tools/studio-spike are NOT here:
      # they drive the system's installed Edge, which a runner does not have.
      - name: Test
        run: npm test
