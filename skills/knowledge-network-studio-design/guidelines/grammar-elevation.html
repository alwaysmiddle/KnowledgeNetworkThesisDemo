<!-- @dsCard group="Grammar" viewport="700x200" subtitle="The one rule: stops sit up, groups sit down, collapsed groups sit up with a stack behind" name="Containment is depth" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:14px 16px; background:#fff; font-family:var(--font-ui); color:var(--text-1); }
  .row { display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:5px; }
  .chip { width:78px; height:40px; border-radius:var(--radius-sm); border:1px solid var(--border-card); }
  .n { font-size:9.5px; color:var(--text-2); line-height:1.35; }
  .v { font-family:var(--font-mono); font-size:9px; color:var(--text-3); }

</style>
</head>
<body>
<div class="row" style="gap:30px;align-items:center">
<div style="display:flex;flex-direction:column;gap:6px;align-items:center">
  <div style="width:150px;height:34px;border-radius:var(--radius-pill);background:var(--surface-card);border:2px solid var(--domain-net);box-shadow:var(--lift-node);display:flex;align-items:center;gap:6px;padding:0 10px;font-size:var(--fs-label);font-weight:600;color:var(--domain-net)"><span style="width:16px;height:16px;border-radius:50%;background:var(--road-badge);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center">4</span>TCP vs UDP</div>
  <div class="n">a stop — raised</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center">
  <div style="width:180px;height:84px;border-radius:var(--radius-card);background:var(--surface-well-1);border:1px solid var(--border-well);box-shadow:var(--sink-well);padding:6px 8px">
    <div style="font-size:var(--fs-title);font-weight:700;color:var(--text-1)">Secure the channel</div>
    <div style="margin-top:6px;height:22px;border-radius:var(--radius-pill);background:var(--surface-card);border:1px solid var(--border-card);box-shadow:var(--lift-node)"></div>
    <div style="margin-top:6px;height:22px;border-radius:var(--radius-pill);background:var(--surface-card);border:1px solid var(--border-card);box-shadow:var(--lift-node)"></div>
  </div>
  <div class="n">a group, open — recessed</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center">
  <div style="position:relative;width:170px;height:40px">
    <div style="position:absolute;left:12px;right:12px;bottom:-12px;height:20px;border-radius:var(--radius-md);background:var(--surface-well-3);border:1px solid var(--border-well-strong)"></div>
    <div style="position:absolute;left:6px;right:6px;bottom:-6px;height:20px;border-radius:var(--radius-md);background:var(--surface-well-2);border:1px solid var(--border-well-strong)"></div>
    <div style="position:absolute;inset:0;border-radius:var(--radius-md);background:var(--surface-card);border:1px solid var(--border-card);box-shadow:var(--lift-node);display:flex;align-items:center;gap:6px;padding:0 9px;font-size:var(--fs-title);font-weight:700">Secure the channel <span style="font-weight:400;color:var(--text-3);font-size:var(--fs-micro)">4</span></div>
  </div>
  <div class="n">the same group, collapsed — a node again</div>
</div>
</div>
</body>
</html>
