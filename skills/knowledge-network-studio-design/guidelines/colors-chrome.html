<!-- @dsCard group="Colors" viewport="700x150" subtitle="Slate carries all Studio furniture — panes, rules, ink" name="Neutral chrome" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:14px 16px; background:#fff; font-family:var(--font-ui); color:var(--text-1); }
  .row { display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:5px; }
  .chip { width:78px; height:40px; border-radius:var(--radius-sm); border:1px solid var(--border-card); }
  .n { font-size:9.5px; color:var(--text-2); line-height:1.35; }
  .v { font-family:var(--font-mono); font-size:9px; color:var(--text-3); }

</style>
</head>
<body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--slate-50)"></div><div class="n">slate-50</div><div class="v">--slate-50</div></div>
<div class="sw"><div class="chip" style="background:var(--slate-100)"></div><div class="n">slate-100</div><div class="v">--slate-100</div></div>
<div class="sw"><div class="chip" style="background:var(--slate-200)"></div><div class="n">slate-200</div><div class="v">--slate-200</div></div>
<div class="sw"><div class="chip" style="background:var(--slate-300)"></div><div class="n">slate-300</div><div class="v">--slate-300</div></div>
<div class="sw"><div class="chip" style="background:var(--slate-400)"></div><div class="n">slate-400</div><div class="v">--slate-400</div></div>
<div class="sw"><div class="chip" style="background:var(--slate-500)"></div><div class="n">slate-500</div><div class="v">--slate-500</div></div>
<div class="sw"><div class="chip" style="background:var(--slate-600)"></div><div class="n">slate-600</div><div class="v">--slate-600</div></div>
<div class="sw"><div class="chip" style="background:var(--slate-700)"></div><div class="n">slate-700</div><div class="v">--slate-700</div></div>
</div>
</body>
</html>
