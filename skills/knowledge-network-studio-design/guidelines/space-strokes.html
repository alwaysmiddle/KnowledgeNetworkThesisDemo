<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Dashed always means conditional: optional stop, inactive bypass" name="Strokes & dashes" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:14px 16px; background:#fff; font-family:var(--font-ui); color:var(--text-1); }
  .row { display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:5px; }
  .chip { width:78px; height:40px; border-radius:var(--radius-sm); border:1px solid var(--border-card); }
  .n { font-size:9.5px; color:var(--text-2); line-height:1.35; }
  .v { font-family:var(--font-mono); font-size:9px; color:var(--text-3); }

</style>
</head>
<body>
<div class="row" style="gap:22px">
<svg width="150" height="70"><line x1="10" y1="16" x2="140" y2="16" stroke="var(--road-live)" stroke-width="2.5"/><line x1="10" y1="38" x2="140" y2="38" stroke="var(--road-ghost)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="10" y1="58" x2="140" y2="58" stroke="var(--road-ghost)" stroke-width="1.2" stroke-dasharray="3 3"/></svg>
<div style="display:flex;flex-direction:column;gap:9px">
<div class="n">2.5px solid — live road</div><div class="n">1.5px dash 4 3 — off-road arrow</div><div class="n">1.2px dash 3 3 — inactive bypass rail</div></div>
<div style="display:flex;flex-direction:column;gap:6px"><div style="width:120px;height:3px;border-radius:2px;background:var(--drop-line)"></div><div class="n">3px --drop-line — insertion caret</div><div style="width:120px;height:26px;border-radius:var(--radius-pill);border:2px dashed var(--border-dashed-optional)"></div><div class="n">2px dashed — optional stop</div></div>
</div>
</body>
</html>
