<!-- @dsCard group="Colors" viewport="700x150" subtitle="One hue per relation; depends_on stays deliberately quiet" name="Edge kinds" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:14px 16px; background:#fff; font-family:var(--font-ui); color:var(--text-1); }
  .row { display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:5px; }
  .chip { width:78px; height:40px; border-radius:var(--radius-sm); border:1px solid var(--border-card); }
  .n { font-size:9.5px; color:var(--text-2); line-height:1.35; }
  .v { font-family:var(--font-mono); font-size:9px; color:var(--text-3); }

</style>
</head>
<body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--edge-depends-on)"></div><div class="n">depends_on · the backbone</div><div class="v">--edge-depends-on</div></div>
<div class="sw"><div class="chip" style="background:var(--edge-uses)"></div><div class="n">uses</div><div class="v">--edge-uses</div></div>
<div class="sw"><div class="chip" style="background:var(--edge-see-also)"></div><div class="n">see_also</div><div class="v">--edge-see-also</div></div>
<div class="sw"><div class="chip" style="background:var(--edge-implemented-with)"></div><div class="n">implemented_with</div><div class="v">--edge-implemented-with</div></div>
<div class="sw"><div class="chip" style="background:var(--edge-mixed)"></div><div class="n">mixed · several types</div><div class="v">--edge-mixed</div></div>
</div>
</body>
</html>
