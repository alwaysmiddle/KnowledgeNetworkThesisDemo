<!-- @dsCard group="Grammar" viewport="700x190" subtitle="The side-by-side only pays off if the two lanes agree" name="Road ↔ rail" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:14px 16px; background:#fff; font-family:var(--font-ui); color:var(--text-1); }
  .row { display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:5px; }
  .chip { width:78px; height:40px; border-radius:var(--radius-sm); border:1px solid var(--border-card); }
  .n { font-size:9.5px; color:var(--text-2); line-height:1.35; }
  .v { font-family:var(--font-mono); font-size:9px; color:var(--text-3); }

</style>
</head>
<body>
<div class="row" style="gap:0;align-items:stretch;width:620px;border:1px solid var(--border-rule);border-radius:var(--radius-md);overflow:hidden">
<div style="flex:1;padding:10px;background:var(--surface-pane);display:flex;flex-direction:column;gap:6px">
  <div style="width:170px;height:26px;border-radius:var(--radius-pill);background:var(--surface-card);border:1px solid var(--border-card);box-shadow:var(--lift-node),var(--ring-linked);display:flex;align-items:center;gap:6px;padding:0 8px;font-size:var(--fs-label)"><span style="width:15px;height:15px;border-radius:50%;background:var(--road-badge);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center">3</span>TCP vs UDP</div>
  <div style="width:190px;height:44px;border-radius:var(--radius-md);background:var(--surface-well-1);border:1px solid var(--border-well);box-shadow:var(--sink-well);padding:5px 7px;font-size:var(--fs-micro);color:var(--text-2)">Secure the channel</div>
</div>
<div style="width:186px;border-left:1px solid var(--border-rule);background:var(--surface-pane);padding:10px;display:flex;flex-direction:column;gap:5px">
  <div style="display:flex;align-items:center;gap:5px"><span style="width:14px;text-align:right;font-family:var(--font-mono);font-size:9px;color:var(--text-3)">3</span><span style="flex:1;padding:2px 6px;border-radius:var(--radius-sm);background:#fff;border:1px solid var(--border-rule);box-shadow:var(--ring-linked);font-size:var(--fs-label)">TCP vs UDP</span></div>
  <div style="display:flex;align-items:center;gap:5px"><span style="width:14px"></span><span style="flex:1;padding:2px 6px;border-radius:var(--radius-sm);background:var(--surface-well-1);border:1px dashed var(--border-well);font-size:var(--fs-label);color:var(--text-2)">⊞ Secure the channel</span></div>
</div>
</div>
<div class="n" style="margin-top:8px;max-width:620px">Shared resolved numbering, and hover-linking extends to containers — the as-built rail binds only leaves, so putting a finger on a group lights nothing.</div>
</body>
</html>
