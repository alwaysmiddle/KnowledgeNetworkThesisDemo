<!-- @dsCard group="Grammar" viewport="700x200" subtitle="One ring on the blocks, one action strip docked to the pane foot" name="Selection" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:14px 16px; background:#fff; font-family:var(--font-ui); color:var(--text-1); }
  .row { display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:5px; }
  .chip { width:78px; height:40px; border-radius:var(--radius-sm); border:1px solid var(--border-card); }
  .n { font-size:9.5px; color:var(--text-2); line-height:1.35; }
  .v { font-family:var(--font-mono); font-size:9px; color:var(--text-3); }

</style>
</head>
<body>
<div style="position:relative;width:640px;height:150px;border:1px solid var(--border-rule);border-radius:var(--radius-md);background:var(--surface-pane);overflow:hidden">
  <div style="position:absolute;left:20px;top:14px;width:150px;height:30px;border-radius:var(--radius-pill);background:var(--surface-card);border:1px solid var(--border-card);box-shadow:var(--lift-node)"></div>
  <div style="position:absolute;left:20px;top:52px;width:150px;height:30px;border-radius:var(--radius-pill);background:var(--state-selected-wash);border:1px solid var(--border-card);box-shadow:var(--ring-selected)"></div>
  <div style="position:absolute;left:20px;top:90px;width:150px;height:30px;border-radius:var(--radius-pill);background:var(--state-selected-wash);border:1px solid var(--border-card);box-shadow:var(--ring-selected)"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:34px;border-top:1px solid var(--border-rule);background:#fff;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:var(--fs-body)">
    <span style="font-weight:600;color:var(--state-selected);font-size:var(--fs-caption)">2 selected</span>
    <span style="padding:3px 8px;border:1px solid var(--border-card);border-radius:var(--radius-sm)">Group</span>
    <span style="padding:3px 8px;border:1px solid var(--border-card);border-radius:var(--radius-sm)">◇ Optional</span>
    <span style="padding:3px 8px;border:1px solid var(--border-card);border-radius:var(--radius-sm);color:var(--state-danger)">Delete…</span>
  </div>
</div>
<div class="n" style="margin-top:8px;max-width:620px">Replaces three stacked layers: per-block ring + bounding selection box + a floating toolbar that flips above/below and wraps by arithmetic, plus a popover under that.</div>
</body>
</html>
