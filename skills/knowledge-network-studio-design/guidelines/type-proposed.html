<!-- @dsCard group="Type" viewport="700x170" subtitle="Proposed: anything read rather than glanced at moves up a step" name="Legibility floor" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:14px 16px; background:#fff; font-family:var(--font-ui); color:var(--text-1); }
  .row { display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:5px; }
  .chip { width:78px; height:40px; border-radius:var(--radius-sm); border:1px solid var(--border-card); }
  .n { font-size:9.5px; color:var(--text-2); line-height:1.35; }
  .v { font-family:var(--font-mono); font-size:9px; color:var(--text-3); }

</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:9px">
<div style="display:flex;align-items:baseline;gap:12px"><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-3);width:96px">--fs-title</span><span style="font-size:var(--fs-title);font-weight:var(--fw-bold)">Secure the channel</span><span class="n">12px · container titles</span></div>
<div style="display:flex;align-items:baseline;gap:12px"><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-3);width:96px">--fs-pane</span><span style="font-size:var(--fs-pane);font-weight:var(--fw-bold)">railroad</span><span class="n">13px · pane header</span></div>
<div class="n" style="margin-top:4px">Unchanged below: numerals, ◇/⥂ marks and tab labels stay at --fs-micro; they are glanced at, not read.</div>
</div>
</body>
</html>
