<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:14px 16px; background:#fff; font-family:var(--font-ui); color:var(--text-1); }
  .row { display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:5px; }
  .chip { width:78px; height:40px; border-radius:var(--radius-sm); border:1px solid var(--border-card); }
  .n { font-size:9.5px; color:var(--text-2); line-height:1.35; }
  .v { font-family:var(--font-mono); font-size:9px; color:var(--text-3); }

</style>
</head>
<body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--domain-sys)"></div><div class="n">sys · hardware, PCB</div><div class="v">--domain-sys</div></div>
<div class="sw"><div class="chip" style="background:var(--domain-math)"></div><div class="n">math · abstraction</div><div class="v">--domain-math</div></div>
<div class="sw"><div class="chip" style="background:var(--domain-cs)"></div><div class="n">cs · the core</div><div class="v">--domain-cs</div></div>
<div class="sw"><div class="chip" style="background:var(--domain-net)"></div><div class="n">net · comms</div><div class="v">--domain-net</div></div>
<div class="sw"><div class="chip" style="background:var(--domain-sec)"></div><div class="n">sec · caution</div><div class="v">--domain-sec</div></div>
<div class="sw"><div class="chip" style="background:var(--domain-se)"></div><div class="n">se · shipping</div><div class="v">--domain-se</div></div>
</div>
</body>
</html>
