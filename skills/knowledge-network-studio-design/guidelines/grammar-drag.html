<!-- @dsCard group="Grammar" viewport="700x200" subtitle="On pick-up the road recedes; only legal targets stay lit" name="Drag mode" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:14px 16px; background:#fff; font-family:var(--font-ui); color:var(--text-1); }
  .row { display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:5px; }
  .chip { width:78px; height:40px; border-radius:var(--radius-sm); border:1px solid var(--border-card); }
  .n { font-size:9.5px; color:var(--text-2); line-height:1.35; }
  .v { font-family:var(--font-mono); font-size:9px; color:var(--text-3); }

</style>
</head>
<body>
<div style="position:relative;width:620px;height:160px;border:1px solid var(--border-rule);border-radius:var(--radius-md);background:var(--surface-pane);padding:12px 16px">
  <div style="opacity:var(--opacity-drag-rest);display:flex;flex-direction:column;gap:5px">
    <div style="width:150px;height:26px;border-radius:var(--radius-pill);background:var(--surface-card);border:1px solid var(--border-card)"></div>
  </div>
  <div style="height:3px;border-radius:2px;background:var(--drop-line);width:150px;margin:6px 0"></div>
  <div style="width:210px;height:60px;border-radius:var(--radius-card);background:var(--surface-well-1);box-shadow:var(--sink-well),var(--ring-drop-inside);border:1px solid var(--border-well);display:flex;align-items:flex-end;padding:6px 8px;font-size:var(--fs-meta);color:var(--text-2)">drop inside</div>
  <div style="opacity:var(--opacity-drag-rest);margin-top:8px;width:150px;height:26px;border-radius:var(--radius-pill);background:var(--surface-card);border:1px solid var(--border-card)"></div>
</div>
<div class="n" style="margin-top:8px;max-width:620px">One caret renderer, not two. The as-built pane draws marks from both a per-block band and a separate slot array, and neither is visible until the pointer is already moving.</div>
</body>
</html>
