<!-- @dsCard group="Colors" viewport="700x160" subtitle="Amber means "on the resolved road" and nothing else" name="The road" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:14px 16px; background:#fff; font-family:var(--font-ui); color:var(--text-1); }
  .row { display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:5px; }
  .chip { width:78px; height:40px; border-radius:var(--radius-sm); border:1px solid var(--border-card); }
  .n { font-size:9.5px; color:var(--text-2); line-height:1.35; }
  .v { font-family:var(--font-mono); font-size:9px; color:var(--text-3); }

</style>
</head>
<body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--road-live)"></div><div class="n">live arrow / bypass in effect</div><div class="v">--road-live</div></div>
<div class="sw"><div class="chip" style="background:var(--road-badge)"></div><div class="n">step-number chip</div><div class="v">--road-badge</div></div>
<div class="sw"><div class="chip" style="background:var(--road-ghost)"></div><div class="n">off-road, skipped</div><div class="v">--road-ghost</div></div>
<div class="sw"><div class="chip" style="background:var(--road-question)"></div><div class="n">a fork’s question</div><div class="v">--road-question</div></div>
<div class="sw"><div class="chip" style="background:var(--state-optional)"></div><div class="n">◇ optional mark</div><div class="v">--state-optional</div></div>
</div>
</body>
</html>
