<!-- @dsCard group="Type" viewport="700x150" subtitle="Every step number is tabular — the rail lines up on it" name="Weights & numerals" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:14px 16px; background:#fff; font-family:var(--font-ui); color:var(--text-1); }
  .row { display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:5px; }
  .chip { width:78px; height:40px; border-radius:var(--radius-sm); border:1px solid var(--border-card); }
  .n { font-size:9.5px; color:var(--text-2); line-height:1.35; }
  .v { font-family:var(--font-mono); font-size:9px; color:var(--text-3); }

</style>
</head>
<body>
<div class="row" style="gap:26px;align-items:baseline">
<div><div class="n">normal 400</div><div style="font-size:var(--fs-label)">a plain leaf</div></div>
<div><div class="n">semibold 600 · leaf titles</div><div style="font-size:var(--fs-label);font-weight:600">IP routing</div></div>
<div><div class="n">bold 700 · containers, badges</div><div style="font-size:var(--fs-label);font-weight:700">Serve it on the network</div></div>
<div><div class="n">tabular-nums</div><div style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:var(--fs-caption)">7 8 9 10 11 12</div></div>
</div>
</body>
</html>
