<!-- @dsCard group="Colors" viewport="700x160" subtitle="Blue = selected. Sky = linked across panes. Rose = destructive" name="State" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:14px 16px; background:#fff; font-family:var(--font-ui); color:var(--text-1); }
  .row { display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:5px; }
  .chip { width:78px; height:40px; border-radius:var(--radius-sm); border:1px solid var(--border-card); }
  .n { font-size:9.5px; color:var(--text-2); line-height:1.35; }
  .v { font-family:var(--font-mono); font-size:9px; color:var(--text-3); }

</style>
</head>
<body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--state-selected)"></div><div class="n">selected</div><div class="v">--state-selected</div></div>
<div class="sw"><div class="chip" style="background:var(--state-selected-wash)"></div><div class="n">selection wash</div><div class="v">--state-selected-wash</div></div>
<div class="sw"><div class="chip" style="background:var(--state-linked)"></div><div class="n">hover correspondence</div><div class="v">--state-linked</div></div>
<div class="sw"><div class="chip" style="background:var(--state-marquee)"></div><div class="n">marquee</div><div class="v">--state-marquee</div></div>
<div class="sw"><div class="chip" style="background:var(--state-danger)"></div><div class="n">destructive</div><div class="v">--state-danger</div></div>
<div class="sw"><div class="chip" style="background:var(--drop-line)"></div><div class="n">insertion caret</div><div class="v">--drop-line</div></div>
</div>
</body>
</html>
