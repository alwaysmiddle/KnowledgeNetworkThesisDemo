<!-- @dsCard group="Railroad" viewport="1000x620" subtitle="The authoring pane rebuilt on the elevation grammar — drag, collapse, fork, select" name="Railroad pane" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Railroad — Knowledge Network Studio</title>
<link rel="stylesheet" href="../../styles.css" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-desk); font-family: var(--font-ui); color: var(--text-1); }
  #root { height: 100vh; }
  button { font-family: inherit; }
  *:focus-visible { outline: 2px solid var(--state-selected); outline-offset: 1px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef } = React;

/* ── corpus (titles + domains as authored in src/corpus/graph.ts) ───────── */
const DOMAIN = { sys:'var(--domain-sys)', math:'var(--domain-math)', cs:'var(--domain-cs)', net:'var(--domain-net)', sec:'var(--domain-sec)', se:'var(--domain-se)' };
const N = {
  'dm-propositional-logic': ['Propositional Logic','math'],
  'dig-transistors-logic-gates': ['Transistors & Logic Gates','sys'],
  'dig-binary-data-representation': ['Binary Data Representation','sys'],
  'dig-combinational-circuits': ['Combinational Circuits','sys'],
  'dig-sequential-logic-memory': ['Sequential Logic & Memory','sys'],
  'arc-instruction-set-architecture': ['Instruction Set Architecture','sys'],
  'arc-memory-hierarchy-caches': ['Memory Hierarchy & Caches','sys'],
  'pl-grammars-parsing': ['Grammars & Parsing','cs'],
  'pl-compilers-interpreters': ['Compilers & Interpreters','cs'],
  'os-processes-threads': ['Processes & Threads','sys'],
  'os-virtual-memory': ['Virtual Memory','sys'],
  'os-cpu-scheduling': ['CPU Scheduling','sys'],
  'stk-dns-naming': ['DNS & Naming','net'],
  'stk-ip-routing': ['IP & Routing','net'],
  'stk-tcp-udp': ['TCP & UDP','net'],
  'cry-public-key-cryptography': ['Public-Key Cryptography','sec'],
  'cry-tls-certificates': ['TLS & Certificates','sec'],
  'cry-symmetric-encryption': ['Symmetric Encryption','sec'],
  'cry-cryptographic-hashing': ['Cryptographic Hashing','sec'],
  'web-http-rest': ['HTTP & REST','net'],
  'web-sockets-apis': ['Sockets & APIs','net'],
  'app-authentication-authorization': ['Authentication & Authorization','sec'],
};
const titleOf = id => (N[id] || [id])[0];
const colorOf = id => DOMAIN[(N[id] || ['','cs'])[1]];

/* ── the plan (src/instruments/walkdesk/mockwalk.ts PLAN) ───────────────── */
const v = (node, note) => ({ node, note, variants: [] });
const group = (key, title, steps) => ({ key, title, variants: [{ label:'', steps }] });

const PLAN = [
  group('machine', 'From transistor to running program', [
    v('dm-propositional-logic','before any hardware: truth as something you can calculate with'),
    v('dig-transistors-logic-gates','the same logic cast in silicon'),
    v('dig-binary-data-representation','two voltage levels means base 2'),
    v('dig-combinational-circuits','gates compose into circuits that compute'),
    v('dig-sequential-logic-memory','feedback lets a circuit remember'),
    v('arc-instruction-set-architecture','the contract everything above will speak'),
    v('arc-memory-hierarchy-caches','where the program and its data actually live'),
    v('pl-grammars-parsing','source code needs structure a machine can recover'),
    v('pl-compilers-interpreters','parsed source in, ISA instructions out'),
    v('os-processes-threads','the compiled program becomes a process'),
    v('os-virtual-memory','the process believes it owns all of memory'),
    v('os-cpu-scheduling','and it takes turns'),
  ]),
  group('serve', 'Serve it on the network', [
    v('stk-dns-naming','a typed name must become an address before anything moves'),
    v('stk-ip-routing','packets hop toward that address with no promises'),
    v('stk-tcp-udp','a reliable stream is built out of the unreliable hops'),
    { key:'secure', title:'Secure the channel',
      question:'How much cryptography does this class need?',
      variants: [
        { label:'Deep dive', steps: [
          v('cry-public-key-cryptography','the trapdoor that lets strangers agree on a secret'),
          v('cry-tls-certificates','the handshake that proves a name and seals the stream'),
          { key:'primitives', title:'The primitives underneath', optional:true, variants:[{ label:'', steps:[
            v('cry-symmetric-encryption','once the key is agreed, the bulk cipher does the work'),
            v('cry-cryptographic-hashing','integrity: the fingerprint every record carries'),
          ]}]},
        ]},
        { label:'Skim', steps: [
          v('cry-tls-certificates','one stop: the padlock, and why it is there'),
        ]},
      ] },
  ]),
  group('speak', 'Speak the application protocol', [
    v('web-http-rest','over the secured stream, the browser finally talks'),
    v('web-sockets-apis','on both ends the conversation is just sockets'),
    v('stk-tcp-udp','the same stream again — a revisit, on purpose'),
  ]),
  v('app-authentication-authorization','the closing leaf: the page knows who it is for'),
];

/* ── model helpers (mirrors mockwalk.ts) ────────────────────────────────── */
const isLeaf = s => s.variants.length === 0;
const isBox = s => s.variants.length > 0;
const isFork = s => s.variants.length > 1;
const chosenIdx = (s, ch) => Math.min(Math.max(s.variants.length - 1, 0), Math.max(0, ch[s.key] ?? 0));
const chosenSteps = (s, ch) => s.variants[chosenIdx(s, ch)]?.steps ?? [];
const pathKey = p => p.join('.');
const visitCount = s => isLeaf(s) ? 1 : Math.max(0, ...s.variants.map(vr => vr.steps.reduce((a,c) => a + visitCount(c), 0)));

const listAt = (root, lp) => { let list = root; for (let i = 0; i < lp.length; i += 2) list = list[lp[i]].variants[lp[i+1]].steps; return list; };
const stopAt = (root, p) => listAt(root, p.slice(0, -1))[p[p.length - 1]];
const clone = x => JSON.parse(JSON.stringify(x));

/* ── the pane ───────────────────────────────────────────────────────────── */
function Railroad() {
  const [stops, setStops] = useState(PLAN);
  const [past, setPast] = useState([]);
  const [future, setFuture] = useState([]);
  const [choices, setChoices] = useState({});
  const [collapsed, setCollapsed] = useState(() => new Set());
  const [selected, setSelected] = useState(() => new Set());
  const [withOptionals, setWithOptionals] = useState(true);
  const [hover, setHover] = useState(null);
  const [prompt, setPrompt] = useState(null);
  const [drag, setDrag] = useState(null);
  const [mark, setMark] = useState(null);
  const [railRight, setRailRight] = useState(true);

  const commit = next => { setPast(p => [...p, stops]); setFuture([]); setStops(next); };
  const undo = () => { if (!past.length) return; setFuture(f => [stops, ...f]); setStops(past[past.length-1]); setPast(p => p.slice(0,-1)); };
  const redo = () => { if (!future.length) return; setPast(p => [...p, stops]); setStops(future[0]); setFuture(f => f.slice(1)); };

  /* one resolved walk — road badges AND rail numbers read from this */
  const resolved = useMemo(() => {
    const order = {}; const rows = []; let n = 0;
    const walk = (list, lp, onRoad, depth) => {
      list.forEach((s, i) => {
        const p = [...lp, i];
        const skipped = !!s.optional && !withOptionals;
        const live = onRoad && !skipped;
        if (isLeaf(s)) {
          if (live) { order[pathKey(p)] = ++n; rows.push({ kind:'node', step:n, id:s.node, path:p, depth }); }
          else order[pathKey(p)] = null;
        } else {
          const ci = chosenIdx(s, choices);
          const from = n + 1;
          const inner = [];
          const sink = collapsed.has(s.key) ? inner : rows;
          const before = rows.length;
          walkInto(s, p, ci, live, depth + 1, sink, order);
          if (collapsed.has(s.key)) rows.push({ kind:'group', key:s.key, title:s.title, path:p, from, to:n, count:visitCount(s), depth, live });
          else void before;
        }
      });
    };
    const walkInto = (s, p, ci, live, depth, sink, order) => {
      const steps = chosenSteps(s, choices);
      steps.forEach((c, j) => {
        const cp = [...p, ci, j];
        const skipped = !!c.optional && !withOptionals;
        const clive = live && !skipped;
        if (isLeaf(c)) {
          if (clive) { order[pathKey(cp)] = ++n; sink.push({ kind:'node', step:n, id:c.node, path:cp, depth }); }
          else order[pathKey(cp)] = null;
        } else {
          const cci = chosenIdx(c, choices);
          const from = n + 1;
          const inner = [];
          const s2 = collapsed.has(c.key) ? inner : sink;
          walkInto(c, cp, cci, clive, depth + 1, s2, order);
          if (collapsed.has(c.key)) sink.push({ kind:'group', key:c.key, title:c.title, path:cp, from, to:n, count:visitCount(c), depth, live: clive });
        }
      });
    };
    walk(stops, [], true, 0);
    const seen = new Set();
    rows.forEach(r => { if (r.kind === 'node') { r.revisit = seen.has(r.id); seen.add(r.id); } });
    return { order, rows };
  }, [stops, choices, collapsed, withOptionals]);

  const toggleCollapse = key => setCollapsed(c => { const n = new Set(c); n.has(key) ? n.delete(key) : n.add(key); return n; });
  const select = (p, add) => { const k = pathKey(p); setPrompt(null); setSelected(s => { if (!add) return new Set([k]); const n = new Set(s); n.has(k) ? n.delete(k) : n.add(k); return n; }); };

  const selPaths = useMemo(() => [...selected].map(k => k.split('.').map(Number)), [selected]);
  const selStops = selPaths.map(p => { try { return stopAt(stops, p); } catch (e) { return null; } }).filter(Boolean);
  const soleContainer = selStops.length === 1 && isBox(selStops[0]) ? selStops[0] : null;

  const mutate = fn => { const next = clone(stops); fn(next); commit(next); };

  const toggleOptional = () => mutate(next => selPaths.forEach(p => { const s = stopAt(next, p); s.optional = !s.optional; }));
  const addVariant = () => { if (!soleContainer) return; mutate(next => { const s = stopAt(next, selPaths[0]); s.variants.push({ label:'Alternative', steps:[] }); }); };
  const del = () => { if (soleContainer) { setPrompt('delete-container'); return; } deleteHard(); };
  const deleteHard = () => { setPrompt(null); mutate(next => { [...selPaths].sort((a,b) => b[b.length-1] - a[a.length-1]).forEach(p => listAt(next, p.slice(0,-1)).splice(p[p.length-1], 1)); }); setSelected(new Set()); };
  const promote = () => { setPrompt(null); mutate(next => { const p = selPaths[0]; const s = stopAt(next, p); const kids = s.variants[chosenIdx(s, choices)].steps; listAt(next, p.slice(0,-1)).splice(p[p.length-1], 1, ...kids); }); setSelected(new Set()); };
  const dropVariant = () => { setPrompt(null); mutate(next => { const s = stopAt(next, selPaths[0]); s.variants.splice(chosenIdx(s, choices), 1); }); };
  const groupSel = () => { if (!selPaths.length) return; mutate(next => {
      const sorted = [...selPaths].sort((a,b) => a[a.length-1] - b[b.length-1]);
      const lp = sorted[0].slice(0,-1); const list = listAt(next, lp);
      if (!sorted.every(p => pathKey(p.slice(0,-1)) === pathKey(lp))) return;
      const idx = sorted[0][sorted[0].length-1];
      const taken = sorted.map(p => list[p[p.length-1]]);
      sorted.slice().reverse().forEach(p => list.splice(p[p.length-1], 1));
      list.splice(idx, 0, { key:'g'+Date.now(), title:'New group', variants:[{ label:'', steps: taken }] });
    }); setSelected(new Set()); };

  const doDrop = () => {
    if (!drag || !mark) { setDrag(null); setMark(null); return; }
    const from = drag.path, band = mark.band, to = mark.path;
    setDrag(null); setMark(null);
    if (pathKey(from) === pathKey(to)) return;
    mutate(next => {
      const moved = clone(stopAt(next, from));
      let target;
      if (band === 'inside') { const s = stopAt(next, to); target = [...to, chosenIdx(s, choices), chosenSteps(s, choices).length]; }
      else target = [...to.slice(0,-1), to[to.length-1] + (band === 'after' ? 1 : 0)];
      listAt(next, from.slice(0,-1)).splice(from[from.length-1], 1);
      const tl = listAt(next, target.slice(0,-1));
      let ti = target[target.length-1];
      if (pathKey(from.slice(0,-1)) === pathKey(target.slice(0,-1)) && from[from.length-1] < ti) ti -= 1;
      tl.splice(Math.min(ti, tl.length), 0, moved);
    });
  };

  const dragging = !!drag;

  /* ── a block ─────────────────────────────────────────────────────────── */
  const Block = ({ s, path, depth, onRoad }) => {
    const key = pathKey(path);
    const sel = selected.has(key);
    const skipped = !!s.optional && !withOptionals;
    const live = onRoad && !skipped;
    const isMe = drag && pathKey(drag.path) === key;
    const marked = mark && pathKey(mark.path) === key ? mark.band : null;
    const dimmed = dragging && !isMe;

    const dragProps = {
      draggable: true,
      onDragStart: e => { e.stopPropagation(); setDrag({ path }); setSelected(new Set([key])); },
      onDragEnd: () => { setDrag(null); setMark(null); },
      onDragOver: e => {
        e.preventDefault(); e.stopPropagation();
        const r = e.currentTarget.getBoundingClientRect();
        const y = (e.clientY - r.top) / r.height;
        const band = (isBox(s) && y > 0.3 && y < 0.7) ? 'inside' : (y < 0.5 ? 'before' : 'after');
        setMark({ path, band });
      },
      onDrop: e => { e.preventDefault(); e.stopPropagation(); doDrop(); },
      onClick: e => { e.stopPropagation(); select(path, e.shiftKey); },
    };

    const hoverProps = isLeaf(s)
      ? { onPointerEnter: () => setHover('n:' + s.node), onPointerLeave: () => setHover(null) }
      : { onPointerEnter: () => setHover('g:' + s.key), onPointerLeave: () => setHover(null) };

    const lit = isLeaf(s) ? hover === 'n:' + s.node : hover === 'g:' + s.key;
    const wrap = { opacity: dimmed ? 'var(--opacity-drag-rest)' : (live ? 1 : 'var(--opacity-off-road)'), transition: 'opacity var(--dur-fade) ease' };

    if (isLeaf(s)) {
      const order = resolved.order[key];
      const color = colorOf(s.node);
      return (
        <div style={wrap}>
          {marked === 'before' && <Caret />}
          <div {...dragProps} {...hoverProps} title={s.note}
            style={{ display:'flex', alignItems:'center', gap:'var(--space-15)', minHeight:'var(--road-node-h)', boxSizing:'border-box',
              padding:'0 var(--space-1) 0 var(--space-15)', borderRadius:'var(--radius-pill)',
              background: sel ? 'var(--state-selected-wash)' : 'var(--surface-card)',
              border:'var(--stroke-node) ' + (s.optional ? 'dashed ' : 'solid ') + color,
              boxShadow: 'var(--lift-node)' + (sel ? ', var(--ring-selected)' : lit ? ', var(--ring-linked)' : ''),
              cursor:'grab' }}>
            <Gutter order={order} optional={s.optional} />
            <span style={{ flex:1, minWidth:0, fontSize:'var(--fs-label)', fontWeight:'var(--fw-semibold)', color, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{titleOf(s.node)}</span>
            <Menu onClick={e => { e.stopPropagation(); select(path, false); }} />
          </div>
          {marked === 'after' && <Caret />}
        </div>
      );
    }

    const fork = isFork(s);
    const ci = chosenIdx(s, choices);
    const steps = chosenSteps(s, choices);
    const shut = collapsed.has(s.key);

    if (shut) {
      const tint = d => 'var(--surface-well-' + Math.min(Math.max(d,1),4) + ')';
      const st = (inset, drop, d) => ({ position:'absolute', left:inset, right:inset, bottom:-drop, height:20, borderRadius:'var(--radius-md)', background:tint(d), border:'var(--stroke-hair) solid var(--border-well-strong)' });
      return (
        <div style={wrap}>
          {marked === 'before' && <Caret />}
          <div style={{ position:'relative', marginBottom:14 }}>
            <div style={st(12, 12, depth + 3)} />
            <div style={st(6, 6, depth + 2)} />
            <div {...dragProps} {...hoverProps} onDoubleClick={e => { e.stopPropagation(); toggleCollapse(s.key); }}
              style={{ position:'relative', minHeight:'var(--road-node-h)', display:'flex', alignItems:'center', gap:'var(--space-15)',
                padding:'0 var(--space-1) 0 var(--space-15)', borderRadius:'var(--radius-md)',
                background: sel ? 'var(--state-selected-wash)' : 'var(--surface-card)',
                border:'var(--stroke-hair) ' + (s.optional ? 'dashed' : 'solid') + ' var(--border-card)',
                boxShadow:'var(--lift-node)' + (sel ? ', var(--ring-selected)' : marked === 'inside' ? ', var(--ring-drop-inside)' : lit ? ', var(--ring-linked)' : ''),
                cursor:'grab' }}>
              <Gutter fork={fork} optional={s.optional && !fork} />
              <Chevron dir="right" onClick={e => { e.stopPropagation(); toggleCollapse(s.key); }} />
              <span style={{ flex:1, minWidth:0, fontSize:'var(--fs-title)', fontWeight:'var(--fw-bold)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{s.title}</span>
              <span style={{ fontSize:'var(--fs-micro)', color:'var(--text-3)', fontVariantNumeric:'tabular-nums' }}>{visitCount(s)}</span>
              <Menu onClick={e => { e.stopPropagation(); select(path, false); }} />
            </div>
          </div>
          {marked === 'after' && <Caret />}
        </div>
      );
    }

    return (
      <div style={wrap}>
        {marked === 'before' && <Caret />}
        <div onClick={e => { e.stopPropagation(); select(path, e.shiftKey); }}
          onDragOver={dragProps.onDragOver} onDrop={dragProps.onDrop}
          style={{ borderRadius:'var(--radius-card)', background:'var(--surface-well-' + Math.min(depth + 1, 4) + ')',
            border:'var(--stroke-hair) ' + (s.optional ? 'dashed' : 'solid') + ' var(--border-well)',
            boxShadow: (depth >= 2 ? 'var(--sink-well-deep)' : 'var(--sink-well)') + (sel ? ', var(--ring-selected)' : marked === 'inside' ? ', var(--ring-drop-inside)' : lit ? ', var(--ring-linked)' : ''),
            padding:'var(--road-pad)' }}>
          <div draggable onDragStart={dragProps.onDragStart} onDragEnd={dragProps.onDragEnd} {...hoverProps}
            style={{ display:'flex', alignItems:'center', gap:'var(--space-15)', minHeight:'var(--road-head-h)', cursor:'grab' }}>
            <Gutter fork={fork} optional={s.optional && !fork} />
            <Chevron dir="down" onClick={e => { e.stopPropagation(); toggleCollapse(s.key); }} />
            <span style={{ flex:1, minWidth:0, fontSize:'var(--fs-title)', fontWeight:'var(--fw-bold)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{s.title}</span>
            <span style={{ fontSize:'var(--fs-micro)', color:'var(--text-3)', fontVariantNumeric:'tabular-nums' }}>{visitCount(s)}</span>
            <Menu onClick={e => { e.stopPropagation(); select(path, false); }} />
          </div>

          {fork && <Fork s={s} ci={ci} onPick={i => setChoices(c => ({ ...c, [s.key]: i }))} />}

          <div style={{ marginTop:'var(--space-15)' }}>
            {steps.length === 0
              ? <div style={{ height:'var(--road-empty-body-h)', borderRadius:'var(--radius-md)', border:'var(--stroke-node) dashed var(--drop-zone-border)', background:'var(--drop-zone-wash)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'var(--fs-meta)', color:'var(--text-3)' }}>drop steps here</div>
              : steps.map((c, j) => (
                  <div key={j} style={{ marginBottom: j === steps.length - 1 ? 0 : 'var(--road-gap)', position:'relative' }}>
                    <Block s={c} path={[...path, ci, j]} depth={depth + 1} onRoad={live} />
                    {j < steps.length - 1 && <Rail live={live} />}
                  </div>
                ))}
          </div>
        </div>
        {marked === 'after' && <Caret />}
      </div>
    );
  };

  const rail = resolved.rows;

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:'var(--surface-pane)' }}
      onClick={() => { setSelected(new Set()); setPrompt(null); }}>

      <div style={{ flex:'0 0 auto', padding:'var(--space-15) var(--space-2)', borderBottom:'var(--stroke-hair) solid var(--border-hairline)', background:'var(--surface-card)' }}>
        <div style={{ fontSize:'var(--fs-pane)', fontWeight:'var(--fw-bold)', lineHeight:'var(--lh-tight)' }}>railroad</div>
        <div style={{ marginTop:2, fontSize:'var(--fs-meta)', color:'var(--text-3)' }}>the road can fork and rejoin; ● picks the branch</div>
        <div style={{ marginTop:'var(--space-15)', display:'flex', alignItems:'center', gap:'var(--space-1)', flexWrap:'wrap' }}>
          <Btn tone={withOptionals ? 'neutral' : 'warn'} onClick={e => { e.stopPropagation(); setWithOptionals(!withOptionals); }}>◇ optionals: {withOptionals ? 'on the road' : 'bypassed'}</Btn>
          <Btn onClick={e => { e.stopPropagation(); setRailRight(!railRight); }}>route {railRight ? '→ right' : '← left'}</Btn>
          <span style={{ marginLeft:'auto', display:'flex', gap:'var(--space-1)' }}>
            <Btn disabled={!past.length} onClick={e => { e.stopPropagation(); undo(); }}>↶ undo</Btn>
            <Btn disabled={!future.length} onClick={e => { e.stopPropagation(); redo(); }}>↷ redo</Btn>
          </span>
        </div>
      </div>

      <div style={{ flex:'1 1 auto', minHeight:0, display:'flex' }}>
        <div style={{ flex:'1 1 auto', minWidth:0, overflow:'auto', padding:'var(--road-margin)', order: railRight ? 0 : 1 }}
          onDragOver={e => e.preventDefault()}>
          <div style={{ maxWidth:520, margin:'0 auto' }}>
            {stops.map((s, i) => (
              <div key={i} style={{ marginBottom: i === stops.length - 1 ? 0 : 'var(--road-gap)', position:'relative' }}>
                <Block s={s} path={[i]} depth={0} onRoad={true} />
                {i < stops.length - 1 && <Rail live />}
              </div>
            ))}
          </div>
        </div>

        <div style={{ flex:'0 0 var(--rail-w)', width:'var(--rail-w)', minHeight:0, display:'flex', flexDirection:'column',
          order: railRight ? 1 : 0, background:'var(--surface-pane)',
          borderLeft: railRight ? 'var(--stroke-hair) solid var(--border-rule)' : 0,
          borderRight: railRight ? 0 : 'var(--stroke-hair) solid var(--border-rule)' }}>
          <div style={{ flex:'0 0 auto', padding:'var(--space-15) var(--space-2)', borderBottom:'var(--stroke-hair) solid var(--border-hairline)' }}>
            <div style={{ fontSize:'var(--fs-caption)', fontWeight:'var(--fw-bold)', color:'var(--text-2)' }}>projected route</div>
            <div style={{ fontSize:'var(--fs-meta)', color:'var(--text-3)' }}>{rail.length} entries · same numbering as the road</div>
          </div>
          <ol style={{ flex:'1 1 auto', minHeight:0, overflow:'auto', margin:0, padding:'var(--space-15)', display:'flex', flexDirection:'column', gap:'var(--space-1)' }}>
            {rail.map((r, i) => r.kind === 'group' ? (
              <li key={i} style={{ display:'flex', alignItems:'center', gap:'var(--space-1)', listStyle:'none' }}
                onPointerEnter={() => setHover('g:' + r.key)} onPointerLeave={() => setHover(null)}>
                <span style={{ width:'var(--rail-step-w)', flex:'0 0 var(--rail-step-w)', textAlign:'right', whiteSpace:'nowrap', fontSize:'var(--fs-micro)', color:'var(--text-3)', fontVariantNumeric:'tabular-nums' }}>{r.to >= r.from ? r.from + '–' + r.to : ''}</span>
                <span style={{ flex:1, minWidth:0, display:'inline-flex', alignItems:'center', gap:'var(--space-1)', padding:'2px var(--space-15)', borderRadius:'var(--radius-sm)',
                  border:'var(--stroke-hair) dashed var(--border-well)', background:'var(--surface-well-1)', fontSize:'var(--fs-label)', color:'var(--text-2)',
                  boxShadow: hover === 'g:' + r.key ? 'var(--ring-linked)' : undefined, whiteSpace:'nowrap', overflow:'hidden', opacity: r.live ? 1 : 'var(--opacity-off-road)' }}>
                  <span style={{ overflow:'hidden', textOverflow:'ellipsis' }}>⊞ {r.title}</span>
                  <span style={{ marginLeft:'auto', color:'var(--text-3)', fontSize:'var(--fs-micro)' }}>{r.count}</span>
                </span>
              </li>
            ) : (
              <li key={i} style={{ display:'flex', alignItems:'center', gap:'var(--space-1)', listStyle:'none' }}
                onPointerEnter={() => setHover('n:' + r.id)} onPointerLeave={() => setHover(null)}>
                <span style={{ width:'var(--rail-step-w)', flex:'0 0 var(--rail-step-w)', textAlign:'right', whiteSpace:'nowrap', fontSize:'var(--fs-micro)', color:'var(--text-3)', fontVariantNumeric:'tabular-nums' }}>{r.step}</span>
                <span title={titleOf(r.id)} style={{ flex:1, minWidth:0, display:'inline-flex', alignItems:'center', gap:'var(--space-1)', padding:'2px var(--space-15)', borderRadius:'var(--radius-sm)',
                  border:'var(--stroke-hair) solid var(--border-rule)', background:'var(--surface-card)', fontSize:'var(--fs-label)', color:'var(--text-2)',
                  boxShadow: hover === 'n:' + r.id ? 'var(--ring-linked)' : undefined, whiteSpace:'nowrap', overflow:'hidden' }}>
                  <span style={{ width:6, height:6, borderRadius:'50%', flex:'0 0 auto', background:colorOf(r.id) }} />
                  <span style={{ overflow:'hidden', textOverflow:'ellipsis' }}>{titleOf(r.id)}</span>
                </span>
                {r.revisit && <span style={{ flex:'0 0 auto', fontSize:'var(--fs-caption)', color:'var(--text-3)' }}>↺</span>}
              </li>
            ))}
          </ol>
        </div>
      </div>

      <div onClick={e => e.stopPropagation()}
        style={{ flex:'0 0 auto', borderTop:'var(--stroke-hair) solid var(--border-rule)', background:'var(--surface-card)', padding:'var(--space-15) var(--space-2)', display:'flex', flexDirection:'column', gap:'var(--space-15)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:'var(--space-15)', minHeight:'var(--road-bar-row-h)', flexWrap:'wrap' }}>
          <span style={{ fontSize:'var(--fs-caption)', fontWeight:'var(--fw-semibold)', color: selected.size ? 'var(--state-selected)' : 'var(--text-3)' }}>
            {selected.size ? selected.size + ' selected' : 'nothing selected — click a stop or a group'}
          </span>
          <Btn disabled={selected.size < 2} onClick={groupSel}>⊞ Group</Btn>
          <Btn disabled={!selected.size} onClick={toggleOptional}>◇ Optional</Btn>
          <Btn disabled={!soleContainer} onClick={addVariant}>⑂ Add a branch</Btn>
          <Btn disabled={!selected.size} danger onClick={del}>✕ Delete{soleContainer ? '…' : ''}</Btn>
        </div>
        {prompt === 'delete-container' && soleContainer && (
          <div style={{ borderTop:'var(--stroke-hair) solid var(--border-hairline)', paddingTop:'var(--space-15)', display:'flex', flexDirection:'column', gap:'var(--space-1)' }}>
            <Choice onClick={promote}>Keep the {chosenSteps(soleContainer, choices).length} steps on the road, remove “{soleContainer.title}”</Choice>
            {isFork(soleContainer) && <Choice onClick={dropVariant}>Drop only the “{soleContainer.variants[chosenIdx(soleContainer, choices)].label || 'unnamed'}” branch</Choice>}
            <Choice danger onClick={deleteHard}>Delete “{soleContainer.title}” and all {visitCount(soleContainer)} stops inside it</Choice>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── small parts ────────────────────────────────────────────────────────── */
const Gutter = ({ order, optional, fork }) => {
  const box = { width:'var(--road-gutter-w)', flex:'0 0 var(--road-gutter-w)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'var(--fs-micro)', lineHeight:1, color:'var(--text-3)' };
  if (order) return <span style={box}><span style={{ width:16, height:16, borderRadius:'50%', background:'var(--road-badge)', color:'var(--road-badge-ink)', fontWeight:'var(--fw-bold)', fontVariantNumeric:'tabular-nums', display:'flex', alignItems:'center', justifyContent:'center' }}>{order}</span></span>;
  if (fork) return <span style={{ ...box, color:'var(--road-live)' }}>⑂</span>;
  if (optional) return <span style={box}>◇</span>;
  return <span style={box} />;
};

const Menu = ({ onClick }) => {
  const [hot, setHot] = useState(false);
  return <button onClick={onClick} onMouseEnter={() => setHot(true)} onMouseLeave={() => setHot(false)} aria-label="block actions"
    style={{ flex:'0 0 var(--road-menu-w)', width:'var(--road-menu-w)', height:'var(--road-menu-w)', display:'flex', alignItems:'center', justifyContent:'center',
      border:0, borderRadius:'var(--radius-sm)', background: hot ? 'rgba(51,65,85,0.08)' : 'transparent', color: hot ? 'var(--text-1)' : 'var(--text-3)',
      cursor:'pointer', fontSize:11, lineHeight:1, padding:0 }}>⋯</button>;
};

const Chevron = ({ dir, onClick }) => (
  <button onClick={onClick} aria-label={dir === 'down' ? 'collapse' : 'expand'}
    style={{ flex:'0 0 auto', width:16, height:16, display:'flex', alignItems:'center', justifyContent:'center', padding:0,
      border:'var(--stroke-hair) solid var(--border-well)', borderRadius:'var(--radius-xs)', background:'var(--surface-inset)',
      color:'var(--text-2)', fontSize:8, lineHeight:1, cursor:'pointer' }}>{dir === 'down' ? '▾' : '▸'}</button>
);

const Caret = () => <div style={{ height:'var(--stroke-drop-line)', borderRadius:2, background:'var(--drop-line)', margin:'3px 0', pointerEvents:'none' }} />;

const Rail = ({ live }) => (
  <div style={{ position:'absolute', left:'50%', bottom:'calc(var(--road-gap) * -1)', height:'var(--road-gap)', width:0, pointerEvents:'none', transform:'translateX(-0.5px)' }}>
    <svg width="12" height="26" style={{ position:'absolute', left:-6, top:0, overflow:'visible' }}>
      <line x1="6" y1="2" x2="6" y2="19" stroke={live ? 'var(--road-live)' : 'var(--road-ghost)'} strokeWidth={live ? 2.5 : 1.5} strokeDasharray={live ? undefined : '4 3'} />
      <path d={live ? 'M 2 17 L 6 23 L 10 17 z' : 'M 3 18 L 6 22.5 L 9 18 z'} fill={live ? 'var(--road-live)' : 'var(--road-ghost)'} />
    </svg>
  </div>
);

const Btn = ({ children, onClick, disabled, tone, danger }) => (
  <button onClick={onClick} disabled={disabled}
    style={{ minHeight:'var(--road-hit-min)', padding:'0 var(--space-2)', display:'inline-flex', alignItems:'center', gap:'var(--space-1)',
      fontSize:'var(--fs-caption)', lineHeight:1, whiteSpace:'nowrap', borderRadius:'var(--radius-sm)',
      border:'var(--stroke-hair) solid ' + (tone === 'warn' ? 'var(--amber-400)' : danger ? 'var(--border-card)' : 'var(--border-card)'),
      background: tone === 'warn' ? 'var(--amber-50)' : 'var(--surface-card)',
      color: tone === 'warn' ? 'var(--amber-700)' : danger ? 'var(--state-danger)' : 'var(--text-2)',
      opacity: disabled ? 'var(--opacity-disabled)' : 1, cursor: disabled ? 'default' : 'pointer' }}>{children}</button>
);

const Choice = ({ children, danger, onClick }) => (
  <button onClick={onClick}
    style={{ textAlign:'left', minHeight:'var(--road-hit-min)', padding:'var(--space-1) var(--space-15)', fontSize:'var(--fs-body)', textWrap:'pretty',
      borderRadius:'var(--radius-sm)', border:'var(--stroke-hair) solid ' + (danger ? 'var(--state-danger)' : 'var(--border-card)'),
      background: danger ? 'var(--state-danger-wash)' : 'var(--surface-card)', color: danger ? 'var(--state-danger)' : 'var(--text-1)', cursor:'pointer' }}>{children}</button>
);

function Fork({ s, ci, onPick }) {
  const hidden = s.variants.filter((v, i) => i !== ci);
  return (
    <div style={{ marginTop:'var(--space-1)' }}>
      <div style={{ minHeight:'var(--road-question-h)', padding:'2px 4px', fontSize:'var(--fs-meta)', fontStyle:'italic', color:'var(--road-question)',
        background:'var(--surface-inset)', border:'var(--stroke-hair) solid var(--border-well)', borderRadius:'var(--radius-xs)' }}>
        {s.question || 'what does this fork decide?'}
      </div>
      <div style={{ display:'flex', gap:'var(--space-1)', marginTop:'var(--space-1)' }}>
        {s.variants.map((v, i) => {
          const on = i === ci;
          const count = v.steps.reduce((a, c) => a + visitCount(c), 0);
          return (
            <div key={i} role="radio" aria-checked={on} onClick={e => { e.stopPropagation(); onPick(i); }}
              style={{ flex:1, minWidth:0, display:'flex', alignItems:'center', gap:'var(--space-1)', minHeight:'var(--road-hit-min)', padding:'0 var(--space-15)',
                borderRadius:'var(--radius-sm)', background: on ? 'var(--amber-100)' : 'var(--surface-card)',
                border:'var(--stroke-hair) solid ' + (on ? 'var(--amber-500)' : 'var(--border-card)'), cursor:'pointer' }}>
              <span style={{ fontSize:'var(--fs-micro)', color: on ? 'var(--amber-600)' : 'var(--text-3)' }}>{on ? '●' : '○'}</span>
              <span style={{ flex:1, minWidth:0, fontSize:'var(--fs-micro)', fontWeight: on ? 'var(--fw-bold)' : 'var(--fw-normal)',
                color: on ? 'var(--amber-700)' : 'var(--text-2)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{v.label || 'unnamed'}</span>
              <span style={{ fontSize:'var(--fs-micro)', fontVariantNumeric:'tabular-nums', color: on ? 'var(--amber-600)' : 'var(--text-3)' }}>{count}</span>
            </div>
          );
        })}
      </div>
      {hidden.length > 0 && (
        <div style={{ marginTop:'var(--space-1)', paddingTop:'var(--space-1)', borderTop:'var(--stroke-hair) dashed var(--border-dashed-optional)', fontSize:'var(--fs-micro)', color:'var(--text-3)' }}>
          {hidden.map(v => { const c = v.steps.reduce((a, x) => a + visitCount(x), 0); return (v.label || 'unnamed') + ' holds ' + c + (c === 1 ? ' stop' : ' stops'); }).join(' · ')}, not shown
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Railroad />);
</script>
</body>
</html>
